# MPI Usage Sanitizer Configuration File Example
# This file demonstrates the configuration options available for the MPI sanitizer

[global]
# Instrumentation level: full, lightweight, or performance
instrumentation_level=full

# Global optimization settings
enable_optimizations=true
enable_performance_monitoring=false
enable_deadlock_detection=true
enable_datarace_detection=true

# Output settings
verbose=false
print_statistics=true

# Enabled MPI function types (comma-separated)
enabled_types=pointtopoint,collective,communicator,request,environment

[policy.type.collective]
# Policy for all collective operations
enable_pre_hooks=true
enable_post_hooks=true
enable_performance_hooks=true
enable_error_checking=true
enable_deadlock_detection=true
optimization_level=1

[policy.type.pointtopoint]
# Policy for point-to-point operations
enable_pre_hooks=true
enable_post_hooks=true
enable_performance_hooks=false
enable_error_checking=true
enable_deadlock_detection=true
enable_datarace_detection=true
optimization_level=0

[policy.type.environment]
# Policy for environment operations (Init, Finalize, etc.)
enable_pre_hooks=true
enable_post_hooks=false
enable_performance_hooks=false
enable_error_checking=true
optimization_level=2

[policy.function.MPI_Send]
# Specific policy for MPI_Send function
enable_pre_hooks=true
enable_post_hooks=true
enable_performance_hooks=false
enable_error_checking=true
enable_deadlock_detection=false
enable_datarace_detection=true
optimization_level=0

[policy.function.MPI_Bcast]
# Specific policy for MPI_Bcast function
enable_pre_hooks=true
enable_post_hooks=true
enable_performance_hooks=true
enable_error_checking=true
enable_deadlock_detection=true
optimization_level=1

[policy.function.MPI_Barrier]
# Specific policy for MPI_Barrier function
enable_pre_hooks=true
enable_post_hooks=false
enable_performance_hooks=true
enable_error_checking=false
enable_deadlock_detection=true
optimization_level=2